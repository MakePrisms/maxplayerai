<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1580" viewBox="0 0 1600 1580" role="img" aria-labelledby="title desc"><title id="title">Private jobs: what is public and what is encrypted</title><desc id="desc">Three job flows with public lifecycle metadata, recipient encrypted messages, and access controlled Git files. Proposed implementation, not deployed.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><rect width="1600" height="1580" fill="#f8fafc"/><text x="48" y="60" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#172033">Private jobs: who can see what?</text><text x="48" y="96" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#526177">Revised scope • PR #1031 • 23 September 2026, 13:06 UTC • Not implemented</text><rect x="48" y="122" width="440" height="32" rx="12" fill="#fff3d6" stroke="none"/><text x="60" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9a5b00">PUBLIC: other marketplace users can read</text><rect x="506" y="122" width="334" height="32" rx="12" fill="#ede9fe" stroke="none"/><text x="518" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#6240a2">ENCRYPTED: recipient copies</text><rect x="858" y="122" width="414" height="32" rx="12" fill="#d9f3ed" stroke="none"/><text x="870" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#11685b">PRIVATE GIT: access-controlled files</text><rect x="48" y="174" width="1504" height="102" rx="12" fill="#fff3d6" stroke="none"/><text x="72" y="208" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9a5b00">PUBLIC THROUGHOUT ALL THREE FLOWS</text><text x="72" y="238" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172033">Buyer / seller identities • claims and selection • status • price and deadlines • approved integrity identifiers</text><text x="72" y="263" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6e5730">Public lifecycle events never duplicate private task text, filenames, answers or explanations.</text><text x="308" y="319" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">1  POST / DISCOVER</text><text x="624" y="319" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">2  SELECT SELLER</text><text x="940" y="319" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">3  EXECUTE</text><text x="1256" y="319" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">4  DELIVER / VERIFY</text><text x="48" y="379" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">TARGETED</text><text x="48" y="409" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">PRIVATE</text><text x="48" y="447" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526177">Seller chosen as target.</text><text x="48" y="474" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526177">Task private from start.</text><path d="M604 452 L614 452" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M920 452 L930 452" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1236 452 L1246 452" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="300" y="344" width="304" height="218" rx="12" fill="#ffffff" stroke="#ccd5e0"/><rect x="316" y="362" width="272" height="83" rx="12" fill="#ede9fe" stroke="none"/><text x="328" y="393" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#6240a2">Task → buyer, target,</text><text x="328" y="421" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6240a2">Maxplayer</text><rect x="316" y="459" width="272" height="83" rx="12" fill="#d9f3ed" stroke="none"/><text x="328" y="490" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#11685b">Required private inputs</text><text x="328" y="518" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#11685b">Available before claim</text><rect x="616" y="344" width="304" height="218" rx="12" fill="#ffffff" stroke="#ccd5e0"/><rect x="632" y="362" width="272" height="83" rx="12" fill="#fff3d6" stroke="none"/><text x="644" y="393" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a5b00">Claim + award public</text><text x="644" y="421" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#9a5b00">No task in either</text><rect x="632" y="459" width="272" height="83" rx="12" fill="#eef2f6" stroke="none"/><text x="644" y="490" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#46576c">Assess task + inputs</text><text x="644" y="518" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#46576c">Claim → award → work</text><rect x="932" y="344" width="304" height="218" rx="12" fill="#ffffff" stroke="#ccd5e0"/><rect x="948" y="362" width="272" height="83" rx="12" fill="#ede9fe" stroke="none"/><text x="960" y="393" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#6240a2">Progress explanations</text><text x="960" y="421" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6240a2">Participant copies</text><rect x="948" y="459" width="272" height="83" rx="12" fill="#eef2f6" stroke="none"/><text x="960" y="490" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#46576c">Use pre-claim inputs</text><text x="960" y="518" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#46576c">No new buyer handoff</text><rect x="1248" y="344" width="304" height="218" rx="12" fill="#ffffff" stroke="#ccd5e0"/><rect x="1264" y="362" width="272" height="83" rx="12" fill="#ede9fe" stroke="none"/><text x="1276" y="393" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#6240a2">Answer / review /</text><text x="1276" y="421" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6240a2">rejection explanation</text><rect x="1264" y="459" width="272" height="83" rx="12" fill="#d9f3ed" stroke="none"/><text x="1276" y="490" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#11685b">Delivery files + history</text><text x="1276" y="518" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#11685b">Private job repository</text><text x="48" y="629" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">OPEN POOL</text><text x="48" y="659" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">PRIVATE EXECUTION</text><text x="48" y="697" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526177">Anyone can assess task.</text><text x="48" y="724" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526177">One seller wins award.</text><path d="M604 702 L614 702" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M920 702 L930 702" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1236 702 L1246 702" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="300" y="594" width="304" height="218" rx="12" fill="#ffffff" stroke="#ccd5e0"/><rect x="316" y="612" width="272" height="83" rx="12" fill="#fff3d6" stroke="none"/><text x="328" y="643" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a5b00">Complete PUBLIC task</text><text x="328" y="671" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#9a5b00">Remains public</text><rect x="316" y="709" width="272" height="83" rx="12" fill="#eef2f6" stroke="none"/><text x="328" y="740" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#46576c">Public prerequisites</text><text x="328" y="768" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#46576c">No later private inputs</text><rect x="616" y="594" width="304" height="218" rx="12" fill="#ffffff" stroke="#ccd5e0"/><rect x="632" y="612" width="272" height="83" rx="12" fill="#fff3d6" stroke="none"/><text x="644" y="643" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a5b00">Claims + award public</text><text x="644" y="671" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#9a5b00">Winner is public</text><rect x="632" y="709" width="272" height="83" rx="12" fill="#eef2f6" stroke="none"/><text x="644" y="740" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#46576c">Award authorizes work</text><text x="644" y="768" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#46576c">No extra waiting state</text><rect x="932" y="594" width="304" height="218" rx="12" fill="#ffffff" stroke="#ccd5e0"/><rect x="948" y="612" width="272" height="83" rx="12" fill="#ede9fe" stroke="none"/><text x="960" y="643" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#6240a2">Progress explanations</text><text x="960" y="671" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6240a2">Only selected parties</text><rect x="948" y="709" width="272" height="83" rx="12" fill="#eef2f6" stroke="none"/><text x="960" y="740" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#46576c">Execute offered task</text><text x="960" y="768" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#46576c">No new buyer handoff</text><rect x="1248" y="594" width="304" height="218" rx="12" fill="#ffffff" stroke="#ccd5e0"/><rect x="1264" y="612" width="272" height="83" rx="12" fill="#ede9fe" stroke="none"/><text x="1276" y="643" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#6240a2">Answer / review /</text><text x="1276" y="671" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6240a2">rejection explanation</text><rect x="1264" y="709" width="272" height="83" rx="12" fill="#d9f3ed" stroke="none"/><text x="1276" y="740" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#11685b">Delivery files + history</text><text x="1276" y="768" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#11685b">Private job repository</text><text x="48" y="879" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">EXPLICITLY</text><text x="48" y="909" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">PUBLIC</text><text x="48" y="947" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526177">Targeted or open pool.</text><text x="48" y="974" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526177">Content intentionally public.</text><path d="M604 952 L614 952" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M920 952 L930 952" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M1236 952 L1246 952" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="300" y="844" width="304" height="218" rx="12" fill="#ffffff" stroke="#ccd5e0"/><rect x="316" y="862" width="272" height="83" rx="12" fill="#fff3d6" stroke="none"/><text x="328" y="893" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a5b00">Task PUBLIC</text><text x="328" y="921" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#9a5b00">Discovery text visible</text><rect x="616" y="844" width="304" height="218" rx="12" fill="#ffffff" stroke="#ccd5e0"/><rect x="632" y="862" width="272" height="83" rx="12" fill="#fff3d6" stroke="none"/><text x="644" y="893" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a5b00">Claims + award PUBLIC</text><text x="644" y="921" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#9a5b00">Winner visible</text><rect x="932" y="844" width="304" height="218" rx="12" fill="#ffffff" stroke="#ccd5e0"/><rect x="948" y="862" width="272" height="83" rx="12" fill="#fff3d6" stroke="none"/><text x="960" y="893" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a5b00">Progress explanations</text><text x="960" y="921" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#9a5b00">PUBLIC</text><rect x="948" y="959" width="272" height="83" rx="12" fill="#fff3d6" stroke="none"/><text x="960" y="990" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a5b00">Job files PUBLIC</text><text x="960" y="1018" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#9a5b00">No private-job ACL</text><rect x="1248" y="844" width="304" height="218" rx="12" fill="#ffffff" stroke="#ccd5e0"/><rect x="1264" y="862" width="272" height="83" rx="12" fill="#fff3d6" stroke="none"/><text x="1276" y="893" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a5b00">Answer + delivery files</text><text x="1276" y="921" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#9a5b00">PUBLIC</text><rect x="1264" y="959" width="272" height="83" rx="12" fill="#fff3d6" stroke="none"/><text x="1276" y="990" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a5b00">Review / explanations</text><text x="1276" y="1018" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#9a5b00">PUBLIC</text><rect x="48" y="1092" width="1504" height="211" rx="12" fill="#ffffff" stroke="#ccd5e0"/><text x="72" y="1128" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">WHAT “PRIVATE” MEANS AFTER SELECTION</text><text x="72" y="1166" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">Text</text><text x="158" y="1166" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#6240a2">Sender → NIP-44 + per-recipient envelope → buyer copy + seller copy + Maxplayer copy</text><text x="158" y="1196" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526177">Other users cannot read the plaintext. Maxplayer has its own decryptable copy; relay ownership is not enough.</text><text x="72" y="1237" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">Files</text><text x="158" y="1237" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#11685b">One private Git repository → authenticated buyer + selected seller + Maxplayer access</text><text x="158" y="1267" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526177">File bytes are NOT recipient-encrypted. HTTPS protects transport; repository permissions protect reads.</text><rect x="48" y="1322" width="1504" height="98" rx="12" fill="#eef2f6" stroke="none"/><text x="72" y="1357" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#46576c">EXISTING LIFECYCLE — NO NEW HANDSHAKE</text><text x="72" y="1388" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172033">Offer → claim → award → execute → result → verify → accept → pay → receipt</text><text x="48" y="1462" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">PAYMENT SECRETS: existing private payment protection in every flow; never public or added to content recipient copies.</text><text x="48" y="1497" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526177">New required inputs / follow-up work → new offer. Content formats and Git permissions still need implementation changes.</text><text x="48" y="1533" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#526177">Maxplayer gets its encrypted copies with durable retries. No mandatory decryption ACK or start gate. Verify before payment.</text></svg>