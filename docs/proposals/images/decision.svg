<text x="400.0" y="171.5" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172554">Valid signed review</text>
<text x="400.0" y="195.5" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172554">for exact content?</text>
