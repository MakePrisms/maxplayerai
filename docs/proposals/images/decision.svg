<text x="400.0" y="319.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172554">Unsafe probability meets</text>
<text x="400.0" y="343.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172554">local rejection threshold?</text>
<rect x="30" y="455" width="330" height="80" rx="12" fill="#fff1f2" stroke="#94a3b8"/>
<text x="195.0" y="489.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172554">BLOCK</text>
<text x="195.0" y="513.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172554">Report error or policy refusal</text>
<rect x="440" y="455" width="330" height="80" rx="12" fill="#ecfdf5" stroke="#94a3b8"/>
<text x="605.0" y="489.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172554">CONTINUE</text>
<text x="605.0" y="513.0" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172554">Keep all existing checks</text>
