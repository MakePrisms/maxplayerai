<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">Private job exchange</title><desc id="desc">Four steps pair private content storage, reading, delivery and collection with public offer, claim, award, result and settlement events.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657c"/></marker></defs><rect width="1000" height="780" fill="#ffffff"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#172b40"><text x="32" y="42" font-size="25" font-weight="750">02 / ONE PRIVATE JOB, TWO DATA PATHS</text><text x="32" y="80" font-size="17" font-weight="700">PRIVATE CONTENT / AUTHORISED PARTICIPANTS</text><text x="564" y="80" font-size="17" font-weight="700">PUBLIC COORDINATION EVENTS</text><path d="M 254 223 L 254 255" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 764 223 L 764 255" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 254 373 L 254 405" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 764 373 L 764 405" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 254 523 L 254 555" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 764 523 L 764 555" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 476 165 L 546 165" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="110" width="444" height="113" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="144" font-size="21" font-weight="650">1. Buyer stores the task</text><text x="56" y="174" font-size="18" font-weight="400">Upload immutable private content.</text><rect x="552" y="110" width="416" height="113" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="576" y="144" font-size="21" font-weight="650">Offer</text><text x="576" y="174" font-size="18" font-weight="400">Publish a signed content reference.</text><path d="M 476 315 L 546 315" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="260" width="444" height="113" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="294" font-size="21" font-weight="650">2. Seller reads the task</text><text x="56" y="324" font-size="18" font-weight="400">Check access before claim or work.</text><rect x="552" y="260" width="416" height="113" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="576" y="294" font-size="21" font-weight="650">Claim → Award</text><text x="576" y="324" font-size="18" font-weight="400">Keep selection and status visible.</text><path d="M 476 465 L 546 465" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="410" width="444" height="113" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="444" font-size="21" font-weight="650">3. Seller delivers</text><text x="56" y="474" font-size="18" font-weight="400">Push to this job’s private Git repo.</text><rect x="552" y="410" width="416" height="113" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="576" y="444" font-size="21" font-weight="650">Result</text><text x="576" y="474" font-size="18" font-weight="400">Publish the protected delivery reference.</text><path d="M 476 615 L 546 615" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="560" width="444" height="113" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="594" font-size="21" font-weight="650">4. Buyer verifies / collects</text><text x="56" y="624" font-size="18" font-weight="400">Fetch privately; verify; settle if paid.</text><rect x="552" y="560" width="416" height="113" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="576" y="594" font-size="21" font-weight="650">Accept / Reject</text><text x="576" y="624" font-size="18" font-weight="400">Receipt after settlement, if applicable.</text><text x="32" y="714" font-size="20" font-weight="650">Feedback and follow-up text use the private path too.</text><text x="32" y="747" font-size="18" font-weight="400">Existing payment protection stays in place. Private mode adds no public fallback.</text></g></svg>