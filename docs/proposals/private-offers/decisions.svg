<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">Private and public mode decisions</title><desc id="desc">Private targeted supported jobs use v2. Explicit public jobs retain v1. Unsupported private requests fail without public fallback.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657c"/></marker></defs><rect width="1000" height="660" fill="#ffffff"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#172b40"><text x="32" y="42" font-size="25" font-weight="750">03 / DEFAULT PRIVATE. PUBLIC BY CHOICE.</text><text x="32" y="76" font-size="18" font-weight="400">Proposed release rules — these details still need design agreement.</text><path d="M 466 181 L 546 181" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 466 346 L 546 346" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 466 511 L 546 511" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="118" width="434" height="125" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="152" font-size="21" font-weight="650">Private + selected seller</text><text x="56" y="182" font-size="18" font-weight="400">Supported client and private storage</text><text x="56" y="207" font-size="18" font-weight="400">No explicit public override</text><rect x="552" y="118" width="416" height="125" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="576" y="152" font-size="21" font-weight="650">Post a private v2 job</text><text x="576" y="182" font-size="18" font-weight="400">Public events; protected content</text><text x="576" y="207" font-size="18" font-weight="400">Separate job repository</text><rect x="32" y="283" width="434" height="125" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="56" y="317" font-size="21" font-weight="650">Explicit public mode</text><text x="56" y="347" font-size="18" font-weight="400">Buyer deliberately selects public</text><text x="56" y="372" font-size="18" font-weight="400">Existing public jobs stay public</text><rect x="552" y="283" width="416" height="125" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="576" y="317" font-size="21" font-weight="650">Keep the public v1 path</text><text x="576" y="347" font-size="18" font-weight="400">Public open-pool jobs remain available</text><text x="576" y="372" font-size="18" font-weight="400">No retroactive privacy claim</text><rect x="32" y="448" width="434" height="125" rx="12" fill="#fff0d6" stroke="#a1afbe"/><text x="56" y="482" font-size="21" font-weight="650">Private path unavailable</text><text x="56" y="512" font-size="18" font-weight="400">No selected seller, unsupported peer,</text><text x="56" y="537" font-size="18" font-weight="400">or storage cannot protect the data</text><rect x="552" y="448" width="416" height="125" rx="12" fill="#fff0d6" stroke="#a1afbe"/><text x="576" y="482" font-size="21" font-weight="650">Stop before publication</text><text x="576" y="512" font-size="18" font-weight="400">Explain what is unsupported</text><text x="576" y="537" font-size="18" font-weight="400">Never retry as a public job</text><text x="32" y="622" font-size="19" font-weight="650">A follow-up inherits private mode. A public PR is not a private delivery.</text></g></svg>