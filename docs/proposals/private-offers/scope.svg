<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Who can read what</title><desc id="desc">Public events are visible to everyone. Buyer, selected seller and authorised Maxplayer review reach private content through a job access check.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657c"/></marker></defs><rect width="1000" height="620" fill="#ffffff"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#172b40"><text x="32" y="42" font-size="25" font-weight="750">01 / PUBLIC RECORD. PRIVATE CONTENT.</text><text x="32" y="75" font-size="18" font-weight="400">Proposed access model — Maxplayer remains a trusted operator.</text><path d="M 445 169 L 550 169" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 320 377 L 380 377" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 645 377 L 700 377" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 320 530 L 405 530 L 405 436" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="110" width="413" height="120" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="56" y="144" font-size="21" font-weight="650">Public event record</text><text x="56" y="174" font-size="18" font-weight="400">Who • when • price • status</text><text x="56" y="199" font-size="18" font-weight="400">Opaque references, not task text</text><rect x="550" y="110" width="418" height="120" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="574" y="144" font-size="21" font-weight="650">All marketplace viewers</text><text x="574" y="174" font-size="18" font-weight="400">Can follow the lifecycle</text><text x="574" y="199" font-size="18" font-weight="400">Cannot fetch private content</text><text x="32" y="280" font-size="19" font-weight="700">PRIVATE ACCESS — checked on every request</text><rect x="32" y="315" width="288" height="121" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="349" font-size="21" font-weight="650">Buyer + selected seller</text><text x="56" y="379" font-size="18" font-weight="400">Read their job content</text><text x="56" y="404" font-size="18" font-weight="400">Write in their own roles</text><rect x="380" y="315" width="265" height="121" rx="12" fill="#f0f2f5" stroke="#a1afbe"/><text x="404" y="349" font-size="21" font-weight="650">Job access check</text><text x="404" y="379" font-size="18" font-weight="400">Verify identity</text><text x="404" y="404" font-size="18" font-weight="400">Verify job permission</text><rect x="700" y="315" width="268" height="171" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="724" y="349" font-size="21" font-weight="650">Private storage</text><text x="724" y="379" font-size="18" font-weight="400">Task + response text</text><text x="724" y="404" font-size="18" font-weight="400">Files + job Git repo</text><text x="724" y="429" font-size="18" font-weight="400">Not public media</text><rect x="32" y="474" width="288" height="116" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="508" font-size="21" font-weight="650">Maxplayer review</text><text x="56" y="538" font-size="18" font-weight="400">Explicit review role</text><text x="56" y="563" font-size="18" font-weight="400">Record access purpose</text><text x="444" y="530" font-size="21" font-weight="650">A URL is not permission.</text><text x="444" y="560" font-size="18" font-weight="400">Other users are denied, even with the link.</text></g></svg>