<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private offers — diagram collection</title><style>:root{color-scheme:light}body{margin:0;background:#f2f5f8;color:#172b40;font:18px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:40px auto;padding:0 20px}h1{font-size:36px;line-height:1.2}svg{display:block;width:100%;height:auto;margin:28px 0;border:1px solid #c4cfda;border-radius:12px}a{color:#1855a2}@media print{svg{break-inside:avoid}}</style></head><body><main><h1>Private offers &amp; deliveries</h1><p>Design proposal · Not implemented · 18 September 2026</p><p>Public coordination. Content available to the buyer, selected seller, and authorised Maxplayer review.</p><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Who can read what</title><desc id="desc">Public events are visible to everyone. Buyer, selected seller and authorised Maxplayer review reach private content through a job access check.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657c"/></marker></defs><rect width="1000" height="620" fill="#ffffff"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#172b40"><text x="32" y="42" font-size="25" font-weight="750">01 / PUBLIC RECORD. PRIVATE CONTENT.</text><text x="32" y="75" font-size="18" font-weight="400">Proposed access model — Maxplayer remains a trusted operator.</text><path d="M 445 169 L 550 169" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 320 377 L 380 377" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 645 377 L 700 377" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 320 530 L 405 530 L 405 436" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="110" width="413" height="120" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="56" y="144" font-size="21" font-weight="650">Public event record</text><text x="56" y="174" font-size="18" font-weight="400">Who • when • price • status</text><text x="56" y="199" font-size="18" font-weight="400">Opaque references, not task text</text><rect x="550" y="110" width="418" height="120" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="574" y="144" font-size="21" font-weight="650">All marketplace viewers</text><text x="574" y="174" font-size="18" font-weight="400">Can follow the lifecycle</text><text x="574" y="199" font-size="18" font-weight="400">Cannot fetch private content</text><text x="32" y="280" font-size="19" font-weight="700">PRIVATE ACCESS — checked on every request</text><rect x="32" y="315" width="288" height="121" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="349" font-size="21" font-weight="650">Buyer + selected seller</text><text x="56" y="379" font-size="18" font-weight="400">Read their job content</text><text x="56" y="404" font-size="18" font-weight="400">Write in their own roles</text><rect x="380" y="315" width="265" height="121" rx="12" fill="#f0f2f5" stroke="#a1afbe"/><text x="404" y="349" font-size="21" font-weight="650">Job access check</text><text x="404" y="379" font-size="18" font-weight="400">Verify identity</text><text x="404" y="404" font-size="18" font-weight="400">Verify job permission</text><rect x="700" y="315" width="268" height="171" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="724" y="349" font-size="21" font-weight="650">Private storage</text><text x="724" y="379" font-size="18" font-weight="400">Task + response text</text><text x="724" y="404" font-size="18" font-weight="400">Files + job Git repo</text><text x="724" y="429" font-size="18" font-weight="400">Not public media</text><rect x="32" y="474" width="288" height="116" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="508" font-size="21" font-weight="650">Maxplayer review</text><text x="56" y="538" font-size="18" font-weight="400">Explicit review role</text><text x="56" y="563" font-size="18" font-weight="400">Record access purpose</text><text x="444" y="530" font-size="21" font-weight="650">A URL is not permission.</text><text x="444" y="560" font-size="18" font-weight="400">Other users are denied, even with the link.</text></g></svg><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">Private job exchange</title><desc id="desc">Four steps pair private content storage, reading, delivery and collection with public offer, claim, award, result and settlement events.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657c"/></marker></defs><rect width="1000" height="780" fill="#ffffff"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#172b40"><text x="32" y="42" font-size="25" font-weight="750">02 / ONE PRIVATE JOB, TWO DATA PATHS</text><text x="32" y="80" font-size="17" font-weight="700">PRIVATE CONTENT / AUTHORISED PARTICIPANTS</text><text x="564" y="80" font-size="17" font-weight="700">PUBLIC COORDINATION EVENTS</text><path d="M 254 223 L 254 255" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 764 223 L 764 255" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 254 373 L 254 405" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 764 373 L 764 405" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 254 523 L 254 555" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 764 523 L 764 555" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 476 165 L 546 165" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="110" width="444" height="113" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="144" font-size="21" font-weight="650">1. Buyer stores the task</text><text x="56" y="174" font-size="18" font-weight="400">Upload immutable private content.</text><rect x="552" y="110" width="416" height="113" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="576" y="144" font-size="21" font-weight="650">Offer</text><text x="576" y="174" font-size="18" font-weight="400">Publish a signed content reference.</text><path d="M 476 315 L 546 315" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="260" width="444" height="113" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="294" font-size="21" font-weight="650">2. Seller reads the task</text><text x="56" y="324" font-size="18" font-weight="400">Check access before claim or work.</text><rect x="552" y="260" width="416" height="113" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="576" y="294" font-size="21" font-weight="650">Claim → Award</text><text x="576" y="324" font-size="18" font-weight="400">Keep selection and status visible.</text><path d="M 476 465 L 546 465" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="410" width="444" height="113" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="444" font-size="21" font-weight="650">3. Seller delivers</text><text x="56" y="474" font-size="18" font-weight="400">Push to this job’s private Git repo.</text><rect x="552" y="410" width="416" height="113" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="576" y="444" font-size="21" font-weight="650">Result</text><text x="576" y="474" font-size="18" font-weight="400">Publish the protected delivery reference.</text><path d="M 476 615 L 546 615" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="560" width="444" height="113" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="594" font-size="21" font-weight="650">4. Buyer verifies / collects</text><text x="56" y="624" font-size="18" font-weight="400">Fetch privately; verify; settle if paid.</text><rect x="552" y="560" width="416" height="113" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="576" y="594" font-size="21" font-weight="650">Accept / Reject</text><text x="576" y="624" font-size="18" font-weight="400">Receipt after settlement, if applicable.</text><text x="32" y="714" font-size="20" font-weight="650">Feedback and follow-up text use the private path too.</text><text x="32" y="747" font-size="18" font-weight="400">Existing payment protection stays in place. Private mode adds no public fallback.</text></g></svg><svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">Private and public mode decisions</title><desc id="desc">Private targeted supported jobs use v2. Explicit public jobs retain v1. Unsupported private requests fail without public fallback.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657c"/></marker></defs><rect width="1000" height="660" fill="#ffffff"/><g font-family="system-ui,Segoe UI,sans-serif" fill="#172b40"><text x="32" y="42" font-size="25" font-weight="750">03 / DEFAULT PRIVATE. PUBLIC BY CHOICE.</text><text x="32" y="76" font-size="18" font-weight="400">Proposed release rules — these details still need design agreement.</text><path d="M 466 181 L 546 181" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 466 346 L 546 346" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><path d="M 466 511 L 546 511" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="118" width="434" height="125" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="56" y="152" font-size="21" font-weight="650">Private + selected seller</text><text x="56" y="182" font-size="18" font-weight="400">Supported client and private storage</text><text x="56" y="207" font-size="18" font-weight="400">No explicit public override</text><rect x="552" y="118" width="416" height="125" rx="12" fill="#dcf3eb" stroke="#a1afbe"/><text x="576" y="152" font-size="21" font-weight="650">Post a private v2 job</text><text x="576" y="182" font-size="18" font-weight="400">Public events; protected content</text><text x="576" y="207" font-size="18" font-weight="400">Separate job repository</text><rect x="32" y="283" width="434" height="125" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="56" y="317" font-size="21" font-weight="650">Explicit public mode</text><text x="56" y="347" font-size="18" font-weight="400">Buyer deliberately selects public</text><text x="56" y="372" font-size="18" font-weight="400">Existing public jobs stay public</text><rect x="552" y="283" width="416" height="125" rx="12" fill="#e8eef8" stroke="#a1afbe"/><text x="576" y="317" font-size="21" font-weight="650">Keep the public v1 path</text><text x="576" y="347" font-size="18" font-weight="400">Public open-pool jobs remain available</text><text x="576" y="372" font-size="18" font-weight="400">No retroactive privacy claim</text><rect x="32" y="448" width="434" height="125" rx="12" fill="#fff0d6" stroke="#a1afbe"/><text x="56" y="482" font-size="21" font-weight="650">Private path unavailable</text><text x="56" y="512" font-size="18" font-weight="400">No selected seller, unsupported peer,</text><text x="56" y="537" font-size="18" font-weight="400">or storage cannot protect the data</text><rect x="552" y="448" width="416" height="125" rx="12" fill="#fff0d6" stroke="#a1afbe"/><text x="576" y="482" font-size="21" font-weight="650">Stop before publication</text><text x="576" y="512" font-size="18" font-weight="400">Explain what is unsupported</text><text x="576" y="537" font-size="18" font-weight="400">Never retry as a public job</text><text x="32" y="622" font-size="19" font-weight="650">A follow-up inherits private mode. A public PR is not a private delivery.</text></g></svg><p>See README.md for the review guide and proposal.md for the complete proposal and acceptance tests.</p></main></body></html>
