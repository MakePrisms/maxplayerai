<?xml version="1.0" encoding="UTF-8"?>
<!-- Authored for this package. Plainsong mark: four staff lines and a rising figure, drawn on the
     4px grid, in accent-600 / ink-900 / ink-300 from tokens.json. No third-party artwork. -->
