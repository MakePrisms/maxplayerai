name: Relay build

# Builds the deployable relay system (`nixosConfigurations.relay`) on a GitHub runner and pushes its
# runtime closure to the public Cachix cache `maxplayer`, so the relay box (EC2 t3.small, 2 vCPU /
# 2 GB) no longer compiles our Rust packages itself during `nixos-rebuild switch` (~2 h there).
# nix/relay-host.nix trusts this cache, so a deploy of a built commit only downloads and activates.
#
# Deploy runbook: push tag `relay-vN` -> wait for this workflow to go green on it -> on the relay:
#   nixos-rebuild switch --flake github:MakePrisms/maxplayerai/relay-vN#relay
# An untagged / unbuilt commit still deploys, it just compiles on the box again.
# Full runbook: docs/DEPLOYMENT.md "Deploying the relay".
#
# Triggers:
#   - `relay-v*` tags: the explicit "build this commit for the relay" signal. Kept apart from the
#     `v*` release tags (release.yml), so a relay build never starts a client release.
#   - manual "Run workflow".
#   - pull requests that change this file, so edits to it are proven before they merge.

on:
  push:
    tags:
      - 'relay-v*'
  pull_request:
    paths:
      - '.github/workflows/relay-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build .#relay (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # Full history, not the default shallow clone: Nix refuses a shallow repository as a flake
      # source unless asked, and the reviewer stamps `self.rev` (#818) into its binary.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Pull from the cache (unchanged packages, e.g. the buzz relay when only crates/ moved, are
      # downloaded instead of rebuilt). skipPush: the daemon would push every path built here,
      # toolchains and vendor dirs included; we push only the relay's runtime closure below.
      - uses: cachix/cachix-action@v17
        with:
          name: maxplayer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Disk before build
        run: df -h /

      - name: Build relay system
        run: |
          nix build '.#nixosConfigurations.relay.config.system.build.toplevel' \
            --print-build-logs --no-link --print-out-paths | tee out-path.txt

      # Runtime closure only; paths already on cache.nixos.org are not re-uploaded. Pull requests
      # build without pushing: they build GitHub's temporary merge commit, whose system (the reviewer
      # stamps its commit, #818) is never deployed, so pushing it would only fill the cache.
      - name: Push relay system to Cachix
        if: github.event_name != 'pull_request'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::CACHIX_AUTH_TOKEN is not set; the relay system was built but not cached."
            exit 1
          fi
          cachix push maxplayer "$(cat out-path.txt)"

      - name: Summary
        if: always()
        run: |
          df -h /
          if [ -s out-path.txt ]; then
            out=$(cat out-path.txt)
            echo "Relay system: \`$out\`" >> "$GITHUB_STEP_SUMMARY"
            nix path-info -Sh "$out" >> "$GITHUB_STEP_SUMMARY"
          fi
