name: Release

# A pushed tag is the ONLY thing that can publish a RELEASE.
#
# `workflow_dispatch` exists so the whole build and every verifier can be exercised on demand, and it
# cannot reach the release or publish jobs. Note that a dispatch can be aimed at a tag ref, so
# `github.ref_type == 'tag'` is not on its own evidence of a tag PUSH — every gate below tests the
# event name as well.
#
# `pull_request` is absent on purpose: a pull request cannot start this workflow at all.
#
# ★ ONE dispatch path does publish, and it lives here rather than in a workflow of its own for a
#   reason worth stating: npm scopes a trusted publisher to a WORKFLOW FILENAME. A credential probe
#   in `npm-oidc-probe.yml` would exercise a publisher entry for `npm-oidc-probe.yml` — a different
#   credential from the one a release depends on, which is the only credential worth proving. So the
#   probe is a job in THIS file, and what it may publish is fenced instead: an explicit non-empty
#   input, a payload package by name, a `0.0.<n>` version no release can ever name, content
#   generated in the job rather than taken from the tree, and the `probe` dist-tag. See `npm-probe`
#   at the bottom, and `verify-release-workflow.sh`, which holds every one of those in place.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      npm_probe_package:
        description: 'Publish-credential probe: payload package to publish a placeholder for. Leave blank for an ordinary dry run.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '@maxplayerai/darwin-arm64'
          - '@maxplayerai/linux-x64'
          - '@maxplayerai/linux-arm64'
      npm_probe_version:
        description: 'Probe version, 0.0.<n> only — bump each run, npm never allows reusing one.'
        required: false
        default: '0.0.1'
        type: string

# Read-only for every job; the two that need to write ask for it themselves.
permissions:
  contents: read

# Never cancel a release in flight. A publish interrupted between the payload packages and the
# launcher leaves the registry in a state where `maxplayer` resolves a binary that was never published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        name: Resolve the version being built
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            # The tag is authoritative: the tree is checked against it, not the other way round.
            version="${GITHUB_REF_NAME#v}"
          else
            # A dry run has no tag. Take the version from the tree so the cross-checks in
            # verify-release-version.sh still compare the crate, the manifests and the pins against
            # each other.
            version="$(node -p "require('./npm/maxplayer/package.json').version")"
          fi
          [ -n "$version" ] || { echo "could not resolve a version" >&2; exit 1; }

          # Any semver pre-release suffix (-rc1, -beta.2, …) marks this a pre-release. Matching the
          # suffix rather than the literal "rc" keeps `-beta` from being published as latest.
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building $version (prerelease=$prerelease)"

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing must not hide another's result — the point of a dry run is to learn
      # about every platform at once.
      fail-fast: false
      matrix:
        # ONE artifact per platform, carrying the whole surface (#510). The release used to cross
        # this list with a `surface` dimension and ship a buyer build and a seller build under
        # separate asset names; a user then had to pick a product before knowing which they wanted,
        # and a platform present in one list and missing from the other shipped a release where
        # sellers could install on x86 and not on arm. What ships now is one `maxplayer` that both
        # buys and sells, so the choice is a runtime one (`maxplayer` vs `maxplayer sell`) rather
        # than a download-time one.
        #
        # The feature split itself is NOT gone — `crates/maxplayer/Cargo.toml` still gates the seller
        # surface behind `acp`, and a buyer-only binary is still `cargo build -p maxplayer
        # --no-default-features --features wallet`. It is no longer a SHIPPING dimension, and CI
        # (`ci.yml`) is what keeps both feature sets compiling.
        platform: [linux-x64, linux-arm64, darwin-arm64]
        include:
          # Native runners throughout. Cross-building the aarch64 static artifact through nix
          # compiles rustc from source, which dominates the build; a native runner per platform
          # avoids that entirely.
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            kind: linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            kind: linux-musl
          - platform: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            kind: darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # musl-gcc, for the C dependencies. secp256k1-sys, libsqlite3-sys and the vendored libgit2-sys
      # each compile C, and they need a compiler targeting musl rather than the host's glibc.
      - name: Install the musl toolchain
        if: matrix.kind == 'linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # macOS ships BSD tar, which rejects the GNU flags that make the archive a function of its
      # contents. Installing GNU tar keeps ONE archive format across every platform; the alternative —
      # per-platform tar flags — would leave each platform with its own archive semantics, which looks
      # like a fix while reducing the determinism guarantee to same-platform-only.
      - name: Install GNU tar (darwin)
        if: matrix.kind == 'darwin'
        run: |
          brew install gnu-tar
          command -v gtar >/dev/null || { echo "gnu-tar installed but gtar is not on PATH" >&2; exit 1; }
          echo "TAR=gtar" >> "$GITHUB_ENV"

      # `--no-default-features --features wallet,acp` names the shipped surface explicitly instead of
      # inheriting `default` (`["wallet"]` today). Stated rather than defaulted because `acp` is the
      # whole of what makes this artifact able to sell: a later edit to `default` must not be able to
      # decide, silently, what a release ships. `verify-seller-surface.sh` below is what proves the
      # features actually landed — this line is only the request.
      - name: Build
        env:
          # Both linux targets are built on a runner of their own architecture, so `musl-gcc` is a
          # native musl compiler in each case rather than a cross toolchain.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build -p maxplayer --release --locked \
            --no-default-features --features wallet,acp \
            --target ${{ matrix.target }}

      # `run: |` is load-bearing wherever the command is continued with a backslash. A plain scalar
      # folds its newline to a space, so `\` + newline reaches the shell as `\ ` — an escaped space,
      # which joins onto the next word instead of continuing the line. The argument then carries a
      # leading space and no path matches it. `verify-release-workflow.sh` fails on the shape.
      - name: Verify the version matches the release
        run: |
          ./scripts/verify-release-version.sh '${{ needs.plan.outputs.version }}' \
            "target/${{ matrix.target }}/release/maxplayer"

      # Which features were compiled in. `version` succeeds in every build, so nothing else here can
      # tell one feature combination from another — a `--features` line that silently stopped naming
      # `acp` would still build, package, checksum and install, and the first report would be a
      # seller whose `maxplayer sell` does not exist. This is the only step that can see the
      # difference, so it runs on every platform rather than on one.
      #
      # `verify-seller-surface.sh` is the whole-surface verifier: wallet in, acp in, `sell` in.
      # `verify-racer-surface.sh` still exists and still runs in `ci.yml` against a default-feature
      # build — nothing ships from that path any more, but the buyer-only feature set must keep
      # compiling and keep being acp-free, which is what that job asserts.
      - name: Verify the shipped surface
        run: ./scripts/verify-seller-surface.sh "target/${{ matrix.target }}/release/maxplayer"

      # The decisive portability check for linux: run the artifact inside alpine and debian with no
      # nix and no toolchain present. This is what makes the choice of musl toolchain above safe to
      # revisit — the property is re-proved on the binary that actually ships, never inherited from
      # a build recipe.
      - name: Verify portability (linux)
        if: matrix.kind == 'linux-musl'
        run: ./scripts/verify-static-artifact.sh "target/${{ matrix.target }}/release/maxplayer"

      # macOS cannot link libSystem statically, so a static check does not apply. What does apply is
      # that the binary must not have picked up a Homebrew or /usr/local dylib: those live outside
      # the base OS, so a user without them gets a binary that cannot start.
      - name: Verify portability (darwin)
        if: matrix.kind == 'darwin'
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/maxplayer"
          otool -L "$BIN"
          if otool -L "$BIN" | grep -Eq '/opt/homebrew|/usr/local'; then
            echo "the artifact links a dylib outside the base OS, so it will not start on a clean mac" >&2
            exit 1
          fi
          echo "ok: links only against base-OS libraries"

      # The archive name is left to `package-release-asset.sh`'s default, `maxplayer`, which is also
      # the name of the binary inside it and the name it answers to. One asset stem is now the whole
      # of the release, so naming it here would only add a second place for it to drift.
      - name: Package the asset
        run: |
          ./scripts/package-release-asset.sh \
            "target/${{ matrix.target }}/release/maxplayer" \
            '${{ matrix.platform }}' '${{ needs.plan.outputs.version }}' dist

      # Determinism is the property those fixed uid/gid/mtime flags exist to provide, so it is proved
      # on the artifact rather than inferred from the flags being present — the same reason
      # portability is re-checked on the binary CI actually built. Runs on every platform: the bug
      # this follows was a platform-specific assumption, and gating only the platform that happened to
      # break would rebuild that mistake.
      #
      # `cmp` rather than a hash: choosing between `sha256sum` and `shasum -a 256` is the very GNU/BSD
      # split this commit removes, and byte-equality is the property anyway.
      - name: Verify the archive is deterministic
        run: |
          ./scripts/package-release-asset.sh \
            "target/${{ matrix.target }}/release/maxplayer" \
            '${{ matrix.platform }}' '${{ needs.plan.outputs.version }}' dist-recheck
          ASSET="maxplayer-${{ needs.plan.outputs.version }}-${{ matrix.platform }}.tar.gz"
          cmp "dist/$ASSET" "dist-recheck/$ASSET" || {
            echo "the archive is not a function of its contents: two runs over identical inputs differ" >&2
            # Say WHERE, because this check runs on platforms nobody here can reproduce, and "they
            # differ" turns the next run into a guess. A difference inside the first 10 bytes is the
            # gzip header (offset 5-8 is its timestamp); anything later is the tar stream itself.
            echo "first 16 bytes of each — gzip header is bytes 1-10, its mtime is 5-8:" >&2
            od -An -tx1 -N16 "dist/$ASSET" >&2
            od -An -tx1 -N16 "dist-recheck/$ASSET" >&2
            exit 1
          }
          echo "ok: two runs over identical inputs produced byte-identical archives"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    # A tag PUSH only. Both halves are needed: a dispatch can target a tag ref, so the ref type
    # alone does not establish that a tag was pushed.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: asset-*
          merge-multiple: true

      - name: Checksum
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          # Every asset the matrix builds, named — which also guards the glob below: with no assets
          # at all, `sha256sum *.tar.gz` would write a SHA256SUMS naming a literal `*.tar.gz`.
          #
          # Named rather than counted because a count cannot tell a complete release from one missing
          # a platform: two assets satisfy "some artifacts arrived", and the release would publish
          # with the third platform's install 404ing. A build job that failed, or an upload whose
          # name drifted, stops the release rather than shrinking it.
          for platform in linux-x64 linux-arm64 darwin-arm64; do
            asset="maxplayer-$VERSION-$platform.tar.gz"
            [ -f "$asset" ] || { echo "$asset is missing — the release would ship without it" >&2; exit 1; }
          done
          # `--` rather than `./*.tar.gz`: it stops option parsing without prefixing every path in
          # SHA256SUMS, which keeps `sha256sum -c SHA256SUMS` usable next to the downloaded files.
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # `install.sh` is attached from the checkout rather than built, and it is attached to EVERY
      # release on purpose: the canonical one-liner docs point at is
      # `releases/latest/download/install.sh`, which GitHub resolves against whichever release is
      # currently latest. A release published without it silently breaks that URL for everyone, not
      # just for users of that version.
      #
      # Asserted before `gh release create` rather than relying on gh's own "file not found": a
      # release that has already been created cannot be un-created, and gh uploads assets after
      # creating it — so a missing file discovered there leaves a published release with no installer.
      - name: Require the installer
        run: |
          set -euo pipefail
          [ -f install.sh ] || {
            echo "install.sh is missing from the checkout — the release would publish without the installer that docs' one-liner points at" >&2
            exit 1
          }
          sh -n install.sh || { echo "install.sh is not valid POSIX sh" >&2; exit 1; }
          echo "ok: install.sh present and parses"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "maxplayer $VERSION" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*.tar.gz dist/SHA256SUMS install.sh

  publish:
    name: npm publish
    # ★ The gate this workflow is judged on. Publishing requires a tag PUSH, so merging this workflow
    #   publishes nothing: `workflow_dispatch` never reaches here, and a pull request cannot trigger
    #   the workflow at all.
    #
    #   Authentication is npm trusted publishing (OIDC) — there is no NPM_TOKEN and therefore no
    #   secret to be missing, so the fail-closed step this job used to open with is gone. That
    #   property survives the change: `npm publish` ERRORS if this repo+workflow is not registered as
    #   a trusted publisher for the package on npmjs.com. There is no silent-skip path — an
    #   unconfigured publisher fails the job loudly, exactly as a missing token used to.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [plan, build, release]
    runs-on: ubuntu-latest
    # `id-token: write` mints the OIDC token npm exchanges for a short-lived publish credential. It is
    # the whole of the job's write authority; `contents: read` restates the workflow default so that
    # naming permissions here does not silently widen them.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No NODE_AUTH_TOKEN goes with this — it only points npm at the public registry, which is
          # also where OIDC exchange happens.
          registry-url: https://registry.npmjs.org

      # Pinned to the 11 line: @latest crossed into npm@12, whose engine floor (node >=22) rejects
      # the node this job runs — and an install-time engine refusal here fails the publish before
      # any OIDC exchange happens.
      # Trusted publishing landed in npm 11.5; the npm bundled with any current setup-node runtime is
      # older than that and would fall back to looking for a token that no longer exists.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: asset-*
          merge-multiple: true

      - name: Publish
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          # Every platform whose payload package is published. Adding a platform package under npm/
          # without adding it here is caught below rather than silently never shipping.
          RELEASE_PLATFORMS: linux-x64 linux-arm64 darwin-arm64
        run: |
          set -euo pipefail

          # A payload package that exists in the tree but is not in RELEASE_PLATFORMS would be left
          # unpublished while the launcher still pins it by exact version — every install on that
          # platform would then resolve a package that is not on the registry. Fail here instead.
          for dir in npm/cli-*/; do
            platform="$(basename "$dir")"; platform="${platform#cli-}"
            case " $RELEASE_PLATFORMS " in
              *" $platform "*) ;;
              *) echo "npm/$(basename "$dir") exists but $platform is not in RELEASE_PLATFORMS — add it or the launcher will pin an unpublished package" >&2; exit 1 ;;
            esac
          done

          # The other direction, and the one that shipped #446: a platform the release BUILDS with no
          # npm payload behind it. The two lists — what the build matrix produces and what npm
          # publishes — were independent, so darwin could be a first-class release artifact for two
          # releases while `npm i maxplayer` answered "no binary for darwin-arm64" on every mac. The
          # assets in dist are the authority; nothing else here knows what was actually built.
          for asset in dist/maxplayer-"$VERSION"-*.tar.gz; do
            # An unmatched glob arrives as the literal pattern, and this loop would then report a
            # platform named `*` rather than the download having produced nothing.
            [ -f "$asset" ] || { echo "no release assets in dist — nothing was downloaded to publish from" >&2; exit 1; }
            platform="$(basename "$asset" .tar.gz)"; platform="${platform#maxplayer-$VERSION-}"
            case " $RELEASE_PLATFORMS " in
              *" $platform "*) ;;
              *) echo "the release builds a $platform artifact but publishes no npm payload for it — add npm/cli-$platform and $platform to RELEASE_PLATFORMS, or state here why that platform is archive-only" >&2; exit 1 ;;
            esac
          done

          # A pre-release goes out under the `rc` dist-tag so `npm i maxplayer` keeps resolving the last
          # stable version. The array always holds at least `--access public`, which is what the
          # scoped payload packages need on their first publish.
          publish_args=(--access public)
          if [ "$PRERELEASE" = true ]; then
            publish_args+=(--tag rc)
          fi

          # Payload packages first. The launcher resolves them by exact version, so publishing it
          # ahead of them leaves a window where `npm i maxplayer` installs a launcher with no binary.
          for platform in $RELEASE_PLATFORMS; do
            # ★ This filename is CONSTRUCTED and must never become a glob. `dist/` holds every
            # platform's archive at once, so a glob here would publish whichever one happened to
            # sort first — an arm64 binary inside the linux-x64 payload package installs fine and
            # cannot exec. The npm payload for a platform is that platform's asset and no other.
            asset="dist/maxplayer-$VERSION-$platform.tar.gz"
            [ -f "$asset" ] || { echo "no built asset for $platform at $asset" >&2; exit 1; }

            mkdir -p "npm/cli-$platform/bin"
            tar -xzf "$asset" -O "maxplayer-$VERSION-$platform/maxplayer" > "npm/cli-$platform/bin/maxplayer"
            chmod 755 "npm/cli-$platform/bin/maxplayer"
            cp LICENSE-MIT LICENSE-APACHE "npm/cli-$platform/"

            ( cd "npm/cli-$platform" && npm publish "${publish_args[@]}" )
          done

          cp LICENSE-MIT LICENSE-APACHE npm/maxplayer/
          ( cd npm/maxplayer && npm publish "${publish_args[@]}" )

  npm-probe:
    name: npm credential probe
    # Dispatch only, and only when a package was explicitly named. An ordinary dry run leaves the
    # input blank and this job never starts; a tag push cannot reach it at all, so a real release
    # never publishes a probe version.
    if: github.event_name == 'workflow_dispatch' && inputs.npm_probe_package != ''
    runs-on: ubuntu-latest
    permissions:
      # The same authority the publish job has. Proving a different credential would prove nothing
      # about the one a release uses.
      id-token: write
      contents: read
    steps:
      # No `actions/checkout`. The job has no repository content, so there is no path by which a
      # file from the tree — a real payload package, a launcher — could reach the registry from
      # here. What gets published is only what the next step writes.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Same pin as the publish job: trusted publishing landed in npm 11.5, and npm@12's engine
      # floor rejects node 20. A probe on a different npm would exercise a different path.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Build the placeholder package
        env:
          PACKAGE: ${{ inputs.npm_probe_package }}
          VERSION: ${{ inputs.npm_probe_version }}
        run: |
          set -euo pipefail

          # Digits only after `0.0.`, anchored by the case arms. `0.0.1-rc.1` and `0.0.1.0` are
          # refused too: the point is a shape no release can ever name, not a blocklist of the
          # versions that look dangerous today.
          case "$VERSION" in
            0.0.[0-9] | 0.0.[0-9][0-9] | 0.0.[0-9][0-9][0-9]) ;;
            *) echo "refusing to publish '$VERSION': the probe may only publish 0.0.<n>, which no release will ever name" >&2; exit 1 ;;
          esac

          # `type: choice` constrains the dispatch FORM, not the API — a dispatch sent with the REST
          # API carries whatever string it likes. The launcher (`maxplayer`) is deliberately absent:
          # it is the package users type, and its dist-tags are how `npx maxplayer` resolves.
          case "$PACKAGE" in
            '@maxplayerai/darwin-arm64' | '@maxplayerai/linux-x64' | '@maxplayerai/linux-arm64') ;;
            *) echo "refusing to publish '$PACKAGE': only the @maxplayerai payload packages may be probed" >&2; exit 1 ;;
          esac

          mkdir -p probe
          cd probe
          node -e '
            const fs = require("fs");
            fs.writeFileSync("package.json", JSON.stringify({
              name: process.env.PACKAGE,
              version: process.env.VERSION,
              description: "Publish-credential probe. Carries no binary and belongs to no release; see README.",
              license: "MIT OR Apache-2.0",
              repository: { type: "git", url: "git+https://github.com/MakePrisms/maxplayerai.git" },
              files: ["README.md"],
            }, null, 2) + "\n");
          '
          {
            echo "# Publish-credential probe"
            echo
            echo "Published by the \`npm-probe\` job in \`.github/workflows/release.yml\` to prove that"
            echo "trusted publishing works for this package before a release depends on it."
            echo
            echo "It carries no binary. Nothing resolves it: the \`maxplayer\` launcher pins its"
            echo "payload by exact version, and no release names a \`0.0.x\`."
          } > README.md
          cat package.json

      - name: Publish through the release's own OIDC path
        working-directory: probe
        # `--tag probe` keeps `latest` where it is. A payload package's dist-tags are not decoration:
        # they are what a bare `npm i @maxplayerai/<platform>` resolves.
        run: npm publish --access public --tag probe

      - name: Say what this run proves
        env:
          PACKAGE: ${{ inputs.npm_probe_package }}
          VERSION: ${{ inputs.npm_probe_version }}
        run: |
          echo "ok: $PACKAGE@$VERSION published from release.yml with no token."
          echo "The trusted-publisher entry for $PACKAGE admits THIS workflow file, which is the"
          echo "same match npm makes when the publish job runs on a tag."
          echo
          echo "Not proven: the other packages. npm scopes a publisher entry per PACKAGE, so a green"
          echo "run here says nothing about the launcher or the other payloads — probe each one."

      # A red here has three causes that look identical from the log — npm answers a trusted-publishing
      # mismatch with a 404 or ENEEDAUTH, which reads like a registry outage. Naming them at the point
      # of failure is the difference between a five-second fix and a re-derivation.
      - name: How to read this failure
        if: failure()
        env:
          PACKAGE: ${{ inputs.npm_probe_package }}
          VERSION: ${{ inputs.npm_probe_version }}
        run: |
          echo "The probe did not publish $PACKAGE@$VERSION. Three different things look like this:"
          echo
          echo "1. THIS VERSION ALREADY EXISTS. npm never allows republishing a version, probe or not."
          echo "   Re-run with a higher npm_probe_version. Check: npm view $PACKAGE versions"
          echo
          echo "2. NO TRUSTED PUBLISHER for $PACKAGE at all. The package has no entry, so nothing"
          echo "   could match. Fix: npmjs.com -> $PACKAGE -> Settings -> Trusted publishing -> add."
          echo
          echo "3. AN ENTRY EXISTS BUT NAMES SOMETHING ELSE. npm matches organization, repository AND"
          echo "   WORKFLOW FILENAME exactly, case-sensitively — plus the environment when one is set."
          echo "   This job runs from release.yml, so an entry naming any other workflow file will not"
          echo "   match no matter how correct it looks. Fix: edit the entry to say release.yml."
          echo
