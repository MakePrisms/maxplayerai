name: Release

# A pushed tag is the ONLY thing that can publish anything.
#
# `workflow_dispatch` exists so the whole build and every verifier can be exercised on demand, and it
# deliberately cannot reach the publishing jobs. Note that a dispatch can be aimed at a tag ref, so
# `github.ref_type == 'tag'` is not on its own evidence of a tag PUSH — every gate below tests the
# event name as well.
#
# `pull_request` is absent on purpose: a pull request cannot start this workflow at all.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only for every job; the two that need to write ask for it themselves.
permissions:
  contents: read

# Never cancel a release in flight. A publish interrupted between the payload packages and the
# launcher leaves the registry in a state where `maxplayer` resolves a binary that was never published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        name: Resolve the version being built
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            # The tag is authoritative: the tree is checked against it, not the other way round.
            version="${GITHUB_REF_NAME#v}"
          else
            # A dry run has no tag. Take the version from the tree so the cross-checks in
            # verify-release-version.sh still compare the crate, the manifests and the pins against
            # each other.
            version="$(node -p "require('./npm/mobee/package.json').version")"
          fi
          [ -n "$version" ] || { echo "could not resolve a version" >&2; exit 1; }

          # Any semver pre-release suffix (-rc1, -beta.2, …) marks this a pre-release. Matching the
          # suffix rather than the literal "rc" keeps `-beta` from being published as latest.
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building $version (prerelease=$prerelease)"

  build:
    name: Build ${{ matrix.surface }} ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing must not hide another's result — the point of a dry run is to learn
      # about every platform at once.
      fail-fast: false
      matrix:
        # Two dimensions that CROSS: every platform is built at both surfaces. Written as dimensions
        # rather than six spelled-out entries because a platform added to one list and forgotten in
        # the other is exactly the shape that ships a release where sellers can install on x86 and
        # not on arm. The `include:` entries below match on an existing value, so each adds its
        # fields to the combinations that already exist instead of creating new ones.
        platform: [linux-x64, linux-arm64, darwin-arm64]
        surface: [racer, seller]
        include:
          # Native runners throughout. Cross-building the aarch64 static artifact through nix
          # compiles rustc from source, which dominates the build; a native runner per platform
          # avoids that entirely.
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            kind: linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            kind: linux-musl
          - platform: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            kind: darwin
          # The two surfaces, each with the verifier that asserts it. The racer is what buyers
          # install and it must not carry the agent-execution path; the seller artifact is the same
          # binary with `acp` compiled in, published under its own name so neither can be reached by
          # a user who asked for the other.
          - surface: racer
            features: wallet
            asset: maxplayer
            verifier: scripts/verify-racer-surface.sh
          - surface: seller
            features: wallet,acp
            asset: maxplayer-seller
            verifier: scripts/verify-seller-surface.sh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed on the surface as well as the target: the two feature sets compile different
          # crates, and one cache shared between them would be evicted and refilled on every run.
          key: release-${{ matrix.target }}-${{ matrix.surface }}

      # musl-gcc, for the C dependencies. secp256k1-sys, libsqlite3-sys and the vendored libgit2-sys
      # each compile C, and they need a compiler targeting musl rather than the host's glibc.
      - name: Install the musl toolchain
        if: matrix.kind == 'linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # macOS ships BSD tar, which rejects the GNU flags that make the archive a function of its
      # contents. Installing GNU tar keeps ONE archive format across every platform; the alternative —
      # per-platform tar flags — would leave each platform with its own archive semantics, which looks
      # like a fix while reducing the determinism guarantee to same-platform-only.
      - name: Install GNU tar (darwin)
        if: matrix.kind == 'darwin'
        run: |
          brew install gnu-tar
          command -v gtar >/dev/null || { echo "gnu-tar installed but gtar is not on PATH" >&2; exit 1; }
          echo "TAR=gtar" >> "$GITHUB_ENV"

      # `--no-default-features` with the feature set named states each surface explicitly instead of
      # relying on `default`. For the racer that is what keeps a later change to `default`
      # (`["wallet"]` today) from quietly compiling the seller's agent-execution path into the
      # artifact handed to buyers; for the seller it states that `acp` is the whole of the
      # difference between the two artifacts.
      - name: Build
        env:
          # Both linux targets are built on a runner of their own architecture, so `musl-gcc` is a
          # native musl compiler in each case rather than a cross toolchain.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build -p maxplayer --release --locked \
            --no-default-features --features ${{ matrix.features }} \
            --target ${{ matrix.target }}

      # `run: |` is load-bearing wherever the command is continued with a backslash. A plain scalar
      # folds its newline to a space, so `\` + newline reaches the shell as `\ ` — an escaped space,
      # which joins onto the next word instead of continuing the line. The argument then carries a
      # leading space and no path matches it. `verify-release-workflow.sh` fails on the shape.
      - name: Verify the version matches the release
        run: |
          ./scripts/verify-release-version.sh '${{ needs.plan.outputs.version }}' \
            "target/${{ matrix.target }}/release/maxplayer"

      # Which features were compiled in. `version` succeeds in every build, so nothing else here can
      # tell one feature combination from another. Each surface is verified by the script that
      # asserts ITS OWN shape — acp out for the racer, acp and `sell` in for the seller — so a
      # feature set that silently swapped between the two artifacts fails on both sides rather than
      # passing a check that only ever looked at one of them.
      - name: Verify the ${{ matrix.surface }} surface
        run: ./${{ matrix.verifier }} "target/${{ matrix.target }}/release/maxplayer"

      # The decisive portability check for linux: run the artifact inside alpine and debian with no
      # nix and no toolchain present. This is what makes the choice of musl toolchain above safe to
      # revisit — the property is re-proved on the binary that actually ships, never inherited from
      # a build recipe.
      - name: Verify portability (linux)
        if: matrix.kind == 'linux-musl'
        run: ./scripts/verify-static-artifact.sh "target/${{ matrix.target }}/release/maxplayer"

      # macOS cannot link libSystem statically, so a static check does not apply. What does apply is
      # that the binary must not have picked up a Homebrew or /usr/local dylib: those live outside
      # the base OS, so a user without them gets a binary that cannot start.
      - name: Verify portability (darwin)
        if: matrix.kind == 'darwin'
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/maxplayer"
          otool -L "$BIN"
          if otool -L "$BIN" | grep -Eq '/opt/homebrew|/usr/local'; then
            echo "the artifact links a dylib outside the base OS, so it will not start on a clean mac" >&2
            exit 1
          fi
          echo "ok: links only against base-OS libraries"

      - name: Package the asset
        run: |
          ./scripts/package-release-asset.sh \
            "target/${{ matrix.target }}/release/maxplayer" \
            '${{ matrix.platform }}' '${{ needs.plan.outputs.version }}' dist \
            '${{ matrix.asset }}'

      # Determinism is the property those fixed uid/gid/mtime flags exist to provide, so it is proved
      # on the artifact rather than inferred from the flags being present — the same reason
      # portability is re-checked on the binary CI actually built. Runs on every platform: the bug
      # this follows was a platform-specific assumption, and gating only the platform that happened to
      # break would rebuild that mistake.
      #
      # `cmp` rather than a hash: choosing between `sha256sum` and `shasum -a 256` is the very GNU/BSD
      # split this commit removes, and byte-equality is the property anyway.
      - name: Verify the archive is deterministic
        run: |
          ./scripts/package-release-asset.sh \
            "target/${{ matrix.target }}/release/maxplayer" \
            '${{ matrix.platform }}' '${{ needs.plan.outputs.version }}' dist-recheck \
            '${{ matrix.asset }}'
          ASSET="${{ matrix.asset }}-${{ needs.plan.outputs.version }}-${{ matrix.platform }}.tar.gz"
          cmp "dist/$ASSET" "dist-recheck/$ASSET" || {
            echo "the archive is not a function of its contents: two runs over identical inputs differ" >&2
            # Say WHERE, because this check runs on platforms nobody here can reproduce, and "they
            # differ" turns the next run into a guess. A difference inside the first 10 bytes is the
            # gzip header (offset 5-8 is its timestamp); anything later is the tar stream itself.
            echo "first 16 bytes of each — gzip header is bytes 1-10, its mtime is 5-8:" >&2
            od -An -tx1 -N16 "dist/$ASSET" >&2
            od -An -tx1 -N16 "dist-recheck/$ASSET" >&2
            exit 1
          }
          echo "ok: two runs over identical inputs produced byte-identical archives"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.surface }}-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    # A tag PUSH only. Both halves are needed: a dispatch can target a tag ref, so the ref type
    # alone does not establish that a tag was pushed.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: asset-*
          merge-multiple: true

      - name: Checksum
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          # Every asset the matrix builds, named — which also guards the glob below: with no assets
          # at all, `sha256sum *.tar.gz` would write a SHA256SUMS naming a literal `*.tar.gz`.
          #
          # Named rather than counted because a count cannot tell a complete release from one missing
          # a whole surface: the racer assets alone satisfy "some artifacts arrived", and the release
          # would publish with `install.sh --seller` 404ing on every platform. A build job that
          # failed, or an upload whose name drifted, stops the release rather than shrinking it.
          for prefix in maxplayer maxplayer-seller; do
            for platform in linux-x64 linux-arm64 darwin-arm64; do
              asset="$prefix-$VERSION-$platform.tar.gz"
              [ -f "$asset" ] || { echo "$asset is missing — the release would ship without it" >&2; exit 1; }
            done
          done
          # `--` rather than `./*.tar.gz`: it stops option parsing without prefixing every path in
          # SHA256SUMS, which keeps `sha256sum -c SHA256SUMS` usable next to the downloaded files.
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # `install.sh` is attached from the checkout rather than built, and it is attached to EVERY
      # release on purpose: the canonical one-liner docs point at is
      # `releases/latest/download/install.sh`, which GitHub resolves against whichever release is
      # currently latest. A release published without it silently breaks that URL for everyone, not
      # just for users of that version.
      #
      # Asserted before `gh release create` rather than relying on gh's own "file not found": a
      # release that has already been created cannot be un-created, and gh uploads assets after
      # creating it — so a missing file discovered there leaves a published release with no installer.
      - name: Require the installer
        run: |
          set -euo pipefail
          [ -f install.sh ] || {
            echo "install.sh is missing from the checkout — the release would publish without the installer that docs' one-liner points at" >&2
            exit 1
          }
          sh -n install.sh || { echo "install.sh is not valid POSIX sh" >&2; exit 1; }
          echo "ok: install.sh present and parses"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "maxplayer $VERSION" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*.tar.gz dist/SHA256SUMS install.sh

  publish:
    name: npm publish
    # ★ The gate this workflow is judged on. Publishing requires a tag PUSH, so merging this workflow
    #   publishes nothing: `workflow_dispatch` never reaches here, and a pull request cannot trigger
    #   the workflow at all.
    #
    #   Authentication is npm trusted publishing (OIDC) — there is no NPM_TOKEN and therefore no
    #   secret to be missing, so the fail-closed step this job used to open with is gone. That
    #   property survives the change: `npm publish` ERRORS if this repo+workflow is not registered as
    #   a trusted publisher for the package on npmjs.com. There is no silent-skip path — an
    #   unconfigured publisher fails the job loudly, exactly as a missing token used to.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [plan, build, release]
    runs-on: ubuntu-latest
    # `id-token: write` mints the OIDC token npm exchanges for a short-lived publish credential. It is
    # the whole of the job's write authority; `contents: read` restates the workflow default so that
    # naming permissions here does not silently widen them.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No NODE_AUTH_TOKEN goes with this — it only points npm at the public registry, which is
          # also where OIDC exchange happens.
          registry-url: https://registry.npmjs.org

      # Pinned to the 11 line: @latest crossed into npm@12, whose engine floor (node >=22) rejects
      # the node this job runs — and an install-time engine refusal here fails the publish before
      # any OIDC exchange happens.
      # Trusted publishing landed in npm 11.5; the npm bundled with any current setup-node runtime is
      # older than that and would fall back to looking for a token that no longer exists.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: asset-*
          merge-multiple: true

      - name: Publish
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          # Every platform whose payload package is published. Adding a platform package under npm/
          # without adding it here is caught below rather than silently never shipping.
          RELEASE_PLATFORMS: linux-x64 linux-arm64 darwin-arm64
        run: |
          set -euo pipefail

          # A payload package that exists in the tree but is not in RELEASE_PLATFORMS would be left
          # unpublished while the launcher still pins it by exact version — every install on that
          # platform would then resolve a package that is not on the registry. Fail here instead.
          for dir in npm/cli-*/; do
            platform="$(basename "$dir")"; platform="${platform#cli-}"
            case " $RELEASE_PLATFORMS " in
              *" $platform "*) ;;
              *) echo "npm/$(basename "$dir") exists but $platform is not in RELEASE_PLATFORMS — add it or the launcher will pin an unpublished package" >&2; exit 1 ;;
            esac
          done

          # The other direction, and the one that shipped #446: a platform the release BUILDS with no
          # npm payload behind it. The two lists — what the build matrix produces and what npm
          # publishes — were independent, so darwin could be a first-class release artifact for two
          # releases while `npm i maxplayer` answered "no binary for darwin-arm64" on every mac. The
          # buyer assets in dist are the authority; nothing else here knows what was actually built.
          #
          # `maxplayer-$VERSION-*` cannot match a seller asset: those carry `-seller` before the
          # version.
          for asset in dist/maxplayer-"$VERSION"-*.tar.gz; do
            # An unmatched glob arrives as the literal pattern, and this loop would then report a
            # platform named `*` rather than the download having produced nothing.
            [ -f "$asset" ] || { echo "no buyer assets in dist — nothing was downloaded to publish from" >&2; exit 1; }
            platform="$(basename "$asset" .tar.gz)"; platform="${platform#maxplayer-$VERSION-}"
            case " $RELEASE_PLATFORMS " in
              *" $platform "*) ;;
              *) echo "the release builds a $platform buyer artifact but publishes no npm payload for it — add npm/cli-$platform and $platform to RELEASE_PLATFORMS, or state here why that platform is archive-only" >&2; exit 1 ;;
            esac
          done

          # A pre-release goes out under the `rc` dist-tag so `npm i maxplayer` keeps resolving the last
          # stable version. The array always holds at least `--access public`, which is what the
          # scoped payload packages need on their first publish.
          publish_args=(--access public)
          if [ "$PRERELEASE" = true ]; then
            publish_args+=(--tag rc)
          fi

          # Payload packages first. The launcher resolves them by exact version, so publishing it
          # ahead of them leaves a window where `npm i maxplayer` installs a launcher with no binary.
          for platform in $RELEASE_PLATFORMS; do
            # ★ This filename is CONSTRUCTED and must never become a glob. The release attaches every
            # artifact the matrix builds, and only the racer belongs in an npm payload — a glob here
            # would publish whichever archive happened to sort first, which is how a seller binary
            # ends up on the registry under the racer's package name.
            asset="dist/maxplayer-$VERSION-$platform.tar.gz"
            [ -f "$asset" ] || { echo "no built asset for $platform at $asset" >&2; exit 1; }

            mkdir -p "npm/cli-$platform/bin"
            tar -xzf "$asset" -O "maxplayer-$VERSION-$platform/maxplayer" > "npm/cli-$platform/bin/maxplayer"
            chmod 755 "npm/cli-$platform/bin/maxplayer"
            cp LICENSE-MIT LICENSE-APACHE "npm/cli-$platform/"

            ( cd "npm/cli-$platform" && npm publish "${publish_args[@]}" )
          done

          cp LICENSE-MIT LICENSE-APACHE npm/mobee/
          ( cd npm/mobee && npm publish "${publish_args[@]}" )
