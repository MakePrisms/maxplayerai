[package]
name = "maxplayer-private-protocol"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Shared private job wire schemas for Maxplayer clients and relay"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
hex = "0.4"
nostr = { version = "0.44", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
