[package]
name = "maxplayer-chat"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
maxplayer-core = { path = "../maxplayer-core", default-features = false, features = ["gateway"] }
nostr-sdk = { version = "0.44.1", features = ["nip44", "nip59", "nip98"] }
tokio = { version = "1.52.0", default-features = false, features = ["rt", "macros", "time", "sync"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
libc = "0.2"

[dev-dependencies]
maxplayer-core = { path = "../maxplayer-core", default-features = false, features = ["gateway", "wallet"] }
nostr-relay-builder = "0.44"
tempfile = "3"
tokio = { version = "1.52.0", default-features = false, features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false }
