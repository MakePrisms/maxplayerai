[package]
name = "maxplayer-trade"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[features]
# Plain-`http://` loopback mints and `ws://` loopback mint relays, for local test fixtures ONLY.
# A user build (`cargo install --locked --path crates/maxplayer-trade`, `cargo build`) never
# enables it and accepts only `https://`/`nostr://` mints and `wss://` mint relays (Petar,
# 2026-11-06). Every test build gets it through the self dev-dependency below; `lab` implies it.
local-test-mints = []
lab = ["local-test-mints"]

[workspace]

[dependencies]
cdk-common = { version = "=0.17.2", default-features = false, features = ["wallet"] }
anyhow = "1"
cdk = { version = "=0.17.2", default-features = false, features = ["wallet"] }
cashu = { version = "=0.17.2", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "=0.17.2", default-features = false, features = ["wallet"] }
nostr-sdk = { version = "=0.44.1", features = ["nip44"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
# Effective uid for the serve socket owner checks (already in the lock through tempfile/tokio).
rustix = { version = "1", default-features = false, features = ["std", "process"] }
rusqlite = "=0.31.0"
url = "2"
# Retry-After as an HTTP-date (already in the lock through hyper/reqwest).
httpdate = "1"
# serve's keyed work units (`sched`): already in the lock through reqwest/hyper.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

uuid = { version = "1", features = ["v4", "serde"] }
bitcoin = "0.32"
# nostr:// mint transport (kinds 23410/23411): the reviewed core connector and wire contract,
# exactly as crates/maxplayer-mint uses them. Path dependency; this crate stays its own workspace.
maxplayer-core = { path = "../maxplayer-core", features = ["wallet"] }

[dev-dependencies]
# Tests, examples and `clippy --all-targets` run against local fake mints: enable
# `local-test-mints` for them only. Dev-dependencies never reach `cargo build`/`cargo install`, so
# the shipped binary keeps the feature off (checked in CI by scripts/check-user-build-mint-fence.sh).
maxplayer-trade = { path = ".", features = ["local-test-mints"] }
cdk = { version = "=0.17.2", default-features = false, features = ["mint", "wallet"] }
cdk-sqlite = { version = "=0.17.2", features = ["mint", "wallet"] }
cdk-fake-wallet = "=0.17.2"
cdk-axum = "=0.17.2"
axum = "0.8"
nostr-relay-builder = "=0.44.0"
# tests/auth_gated.rs: the shared sign-in-gated relay front (maxplayer-core tests/support).
tokio-tungstenite = "=0.26.2"
futures-util = "0.3"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
# tests/nostr.rs: the real Maxplayer credits sidecar (its own workspace) served in-process on a
# local relay. Test-only; production trading never links the mint.
maxplayer-mint = { path = "../maxplayer-mint" }
