[package]
name = "maxplayer-trade"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
anyhow = "1"
cdk = { version = "=0.17.2", default-features = false, features = ["wallet"] }
cashu = { version = "=0.17.2", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "=0.17.2", default-features = false, features = ["wallet"] }
nostr-sdk = { version = "=0.44.1", features = ["nip44"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
url = "2"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
