[package]
# The crate keeps its name; the shipped binary does not. `[[bin]]` below is what makes that
# separable — without it Cargo derives the executable name from the package, which is why the
# application rename looked like it forced a crate rename. Internal crate names are deliberately
# `maxplayer`: nothing publishes to crates.io, so users never see them, and renaming them would touch
# most of the workspace for no user-visible gain.
name = "maxplayer"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "maxplayer"
path = "src/main.rs"

# ── cargo-binstall: the fallback install path ────────────────────────────────────────────────────
#
# `install.sh` is the blessed path (#125). This exists for the rust-native user who already has
# cargo-binstall and would otherwise compile the whole workspace: it points binstall at the same
# GitHub Release assets, which it then verifies and unpacks itself.
#
# ★ What this does NOT do: make `cargo binstall maxplayer` work. binstall reads this metadata out of
#   the registry entry for the crate, and `publish = false` in [workspace.package] means there is no
#   registry entry — neither `maxplayer` nor `maxplayer` exists on crates.io. Until something is
#   published, the working invocation is the one that reads this manifest directly:
#
#     cargo binstall --git https://github.com/MakePrisms/maxplayerai maxplayer
#
#   Note `maxplayer`, not `maxplayer`: binstall resolves a PACKAGE, and the package keeps its name while
#   `[[bin]]` above renames the executable.
#
# ★ Why the URL is written out instead of using `{ repo }`. That template expands to the manifest's
#   `repository` field, which is the buzzrelay mirror, not GitHub — so `{ repo }` here would send
#   every binstall user to a host that publishes no release assets. `scripts/verify-binstall-metadata.sh`
#   asserts the host these URLs actually resolve to.
#
# ★ Why there is no top-level `pkg-url`. Our assets are named by platform (`linux-x64`,
#   `linux-arm64`), and no binstall template variable maps a rust target triple onto those names —
#   any top-level template would therefore be a guess naming assets no release publishes. With only
#   the overrides below, an unlisted target resolves nothing and binstall falls back to building from
#   source, which is the honest outcome. This deliberately mirrors `install.sh`: the supported
#   platform set is linux x86_64, linux aarch64 and macOS arm64, and nothing else is guessed at.
#
# ★ Note what is NOT here: `x86_64-apple-darwin`. The release matrix builds `aarch64-apple-darwin`
#   only, so an Intel-mac override would name an asset no release publishes — 404, and binstall
#   silently compiles from source instead. Same refusal `install.sh` makes for an Intel mac, for the
#   same reason. The two must agree; `scripts/verify-binstall-metadata.sh` holds them to it.
[package.metadata.binstall]
pkg-fmt = "tgz"

# musl, because that is what the release matrix builds. A glibc host is still served: binstall's
# target detection offers both the gnu and the musl triple for a linux host, so the override below is
# reached — and the artifact is statically linked, which release.yml re-proves on debian every run.
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "https://github.com/MakePrisms/maxplayerai/releases/download/v{ version }/maxplayer-{ version }-linux-x64.tar.gz"
bin-dir = "maxplayer-{ version }-linux-x64/maxplayer"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "https://github.com/MakePrisms/maxplayerai/releases/download/v{ version }/maxplayer-{ version }-linux-arm64.tar.gz"
bin-dir = "maxplayer-{ version }-linux-arm64/maxplayer"

# Apple Silicon. No musl/gnu split to worry about here — there is one darwin libc — so unlike the
# linux entries this override is reached on the host's first-choice triple rather than a fallback.
[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "https://github.com/MakePrisms/maxplayerai/releases/download/v{ version }/maxplayer-{ version }-darwin-arm64.tar.gz"
bin-dir = "maxplayer-{ version }-darwin-arm64/maxplayer"

[features]
default = ["wallet"]
# `acp` compiles in the seller surface (agent execution + the `sell` advertise path). That surface
# is a marketplace participant — it signs, delivers over relay-git, and settles — so it requires
# `wallet` (keys, mint, git2, nostr-sdk). Pulling `wallet` here states that dependency in the graph:
# there is no acp-without-wallet build, so the `#[cfg(feature = "acp")]` gates on the seller surface
# are sound (they can rely on the wallet-gated code being present). #360.
acp = ["wallet", "maxplayer-core/acp"]
wallet = ["maxplayer-core/wallet", "dep:git2", "dep:nostr-sdk"]
# Dev-only: exposes `maxplayer stub-pay` (budget-gate exercise). Not on the settlement
# path and not part of the default user CLI surface.
stub-pay = []

[dependencies]
maxplayer-core = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.52.0", features = ["rt", "rt-multi-thread", "time", "macros"] }
# Read-only materialization of a paid delivery from the buyer store (get_result). Local bare-repo
# reads only — no transport — so the workspace's default-features-off git2 (no openssl) suffices.
git2 = { workspace = true, optional = true }
# `whoami` encodes the derived PUBLIC key as its npub (bech32). Same nostr 0.44 line maxplayer-core
# already resolves under `wallet`, so no new resolution — gated by `wallet` because the public key
# it encodes comes from `maxplayer-core::home::public_key_hex`, itself `wallet`-gated.
nostr-sdk = { version = "0.44.1", optional = true }

[dev-dependencies]
cashu = "=0.17.2"
cdk = { version = "=0.17.2", default-features = false, features = ["wallet"] }
cdk-sqlite = "=0.17.2"
