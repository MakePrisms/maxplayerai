[package]
name = "maxplayer-challenges"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Opt-in public-relay community challenges sidecar"

[workspace]

[dependencies]
maxplayer-core = { path = "../maxplayer-core", default-features = false, features = ["gateway"] }
nostr-sdk = "=0.44.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
serde_json = "1"
chrono = "0.4"
url = "2"

[dev-dependencies]
nostr-relay-builder = "=0.44.0"
anyhow = "1"
futures-util = "0.3"
tokio-tungstenite = "=0.26.2"
