[package]
name = "maxplayer-core"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Async channel receives + timeouts in the ACP driver (tokio mpsc / tokio::time): the driver's
# waits must YIELD, not block the thread — the seller node runs every awarded job as a
# `spawn_local` task on ONE LocalSet thread, so a blocking wait in the driver serializes all jobs
# and deafens the run loop (issue #223).
acp = ["tokio/sync", "tokio/time"]
# `tokio/time` is declared here because the gateway's relay-auth window uses `tokio::time::timeout`.
# On native it also arrives transitively through nostr-sdk, but that supplier's tokio feature
# selection is target-conditional and does not provide it on wasm32 (issue #214).
gateway = ["dep:nostr-sdk", "tokio/time"]
# All git legs (seller push/fetch, buyer verify-fetch, ref-advertisement probes) run in-process
# via libgit2 — NO system `git` on any product path (issue #55). Needs nostr-sdk (NIP-98 signing)
# so it composes gateway; git2 (rustls-backed) + reqwest + base64 carry the smart-HTTP transport.
# Running in-process is also what keeps repo hooks inert: libgit2 executes none, so a hook a job
# planted in its own workdir cannot run on the host-side legs. A leg that ever shells out to a
# `git` CLI must neutralise hook lookup itself. `tests/no_system_git.rs` is the guard — tripwire
# `git` on PATH, required-features `git-delivery`, so it runs only in the money-path job (#826).
git-delivery = ["gateway", "dep:git2", "dep:reqwest", "dep:base64"]
# The `wallet` feature also brings up the persistent buyer daemon (crate::buyer): the
# exclusive home lock (libc flock), the durable state DB (rusqlite, bundled sqlite so
# there is no system dependency), and the async unix-socket surface (tokio net + io-util).
# `tokio/signal` carries the seller daemon's graceful-stop listener (issue #747): SIGTERM/SIGINT
# must reach the run loop so it can publish its terminal `accepting=n` seat announcement before
# exiting. With the kernel's default disposition the process dies outright and the seat's last
# `accepting=y` — an addressable event no later beat will correct — stands forever.
# The credential-containment proxy (#647) is a host service the seller node runs for a docker-mode
# job: a tokio TCP listener (`tokio/net`), a hyper/1 HTTP server terminating the container's plain-HTTP
# calls, and a reqwest async client (with `stream`, for SSE responses) forwarding to the real upstream.
# It lives under `wallet` because `seller_exec` — the only caller — already does, so reqwest and
# `tokio/net` are guaranteed present here.
wallet = ["git-delivery", "gateway", "dep:cashu", "dep:cdk", "dep:cdk-sqlite", "dep:nostr-sdk", "dep:rusqlite", "dep:libc", "dep:bytes", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:futures-util", "tokio/sync", "tokio/time", "tokio/net", "tokio/io-util", "tokio/signal"]
# TESTS ONLY, opt-in, OFF by default (issue #720). The four tests that reach a LIVE third-party mint
# over the public internet — two in `job_lifecycle` (post_job's pre-publish fee floor resolves the
# home's shipped minibits default) and two in `payment_wallet` (the worker's real send leg fetches
# testnut's keysets through the wallet's own HTTP client). Nothing but test code reads this flag; it
# enables NO product behaviour and adds NO dependency.
#
# It exists so `wallet` is offline-safe. Before it, `--features wallet` could not be declared in
# `.maxplayer/checks.toml` at all (every declared command runs under `net: denied`), which cost the
# repo its entire wallet-gated test surface — `tests/collect_integrity.rs` and every `seller_node`
# test ran in ZERO declared commands. Those four tests are NOT silenced: the money-path CI job in
# `.github/workflows/ci.yml` turns this feature ON, and that runner has a network. Run them locally
# with `cargo test -p maxplayer-core --features wallet,live-mints` — with a network.
live-mints = []
test-support = []

[dependencies]
base64 = { workspace = true, optional = true }
cashu = { version = "=0.17.2", optional = true }
config.workspace = true
git2 = { workspace = true, optional = true }
# `stream` adds `Response::bytes_stream`, so the credential proxy (#647) can relay an SSE upstream
# response to the container without buffering it. Unions with the workspace feature set.
reqwest = { workspace = true, optional = true, features = ["stream"] }
# Credential-containment proxy transport (#647), all gated to `wallet`. hyper terminates the
# container's plain-HTTP calls; http-body-util streams the upstream response back; bytes is the shared
# body type; futures-util maps the reqwest byte stream into a hyper body.
#
# `http2` and `server-auto` are load-bearing, not future-proofing: a contained client may open its
# second leg with the HTTP/2 prior-knowledge preface (`PRI * HTTP/2.0`) instead of an HTTP/1 request
# line, and an http1-only server cannot parse that — it surfaces NO request at all, so the leg reads
# as "nothing arrived" rather than as a protocol mismatch. `server-auto` sniffs the preface and serves
# whichever the client speaks on the same listener. Measured on `cursor-agent 2026.08.11-e8db854`,
# whose agent endpoint sent 3372 bytes opening with that preface.
bytes = { version = "1", optional = true }
hyper = { version = "1", optional = true, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", optional = true, features = ["tokio", "server-auto"] }
http-body-util = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false }
cdk = { version = "=0.17.2", default-features = false, features = ["wallet"], optional = true }
cdk-sqlite = { version = "=0.17.2", optional = true }
getrandom = "0.3"
hex = "0.4.3"
# Exclusive home lock (flock) for the buyer daemon; unix-only, gated to `wallet`.
libc = { version = "0.2", optional = true }
# Durable buyer state DB (buyer.sqlite). `bundled` compiles sqlite from source so the
# buyer needs no system libsqlite3. Gated to `wallet`.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
nostr-sdk = { version = "0.44.1", features = ["nip59", "nip98"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
tokio = { version = "1.52.0", default-features = false, features = ["rt", "macros"] }
toml = "0.8"

# seller_git (the code path under test) is gated behind `git-delivery`; run with
# `cargo test -p maxplayer-core --features git-delivery --test relay_git_http_auth`.
[[test]]
name = "relay_git_http_auth"
required-features = ["git-delivery"]

# #610 regression: the transport must ignore ambient git config (insteadOf) — gated like above.
[[test]]
name = "git_config_isolation"
required-features = ["git-delivery"]

# A5 (#55): the in-process git legs never shell out to system `git`. Drives the real seller/verify
# entry points with `git` scrubbed from PATH — gated like above; runs in the money-path CI job.
[[test]]
name = "no_system_git"
required-features = ["git-delivery"]

# Relay canary: a manual `#[ignore]`d test against a live relay-git server. It shows two facts with
# evidence. Fact A: a scoped push token cannot write another ref. Fact B: the relay accepts, or
# refuses, a scoped token older than 60 s that carries an expiration tag. Run it with
# `--ignored --nocapture` and the two MAXPLAYER_CANARY_* variables; see the file header.
[[test]]
name = "relay_canary"
required-features = ["git-delivery"]

[dev-dependencies]
async-trait = "0.1.89"
cdk-sqlite = "=0.17.2"
# An HTTP/2 CLIENT, for the credential proxy's aggregate in-flight test only. The proxy's own h2
# support is server-side (hyper `http2`), and `reqwest` here is the UPSTREAM client — enabling h2 on
# it would change how we talk to real vendors, which is not this test's business. Already in the lock
# transitively via hyper/http2, so no new resolution. Test-only: never in the shipped binary.
h2 = "0.4"
# A5 (tests/no_system_git) builds git fixtures and reads commit graphs via libgit2 directly. Same
# workspace pin as the optional [dependencies] git2, so it unifies to one crate instance.
git2 = { workspace = true }
# Sink/Stream helpers for the p-gate relay fixture's websocket split. Already in the workspace lock
# via nostr-sdk; no new resolution.
futures-util = { version = "0.3", default-features = false }
# In-process NIP-01 relay for the seller-daemon live-delivery integration test. Same nostr 0.44
# line as `nostr-sdk` above, so its `Event`/`Filter` types unify with the daemon's.
nostr-relay-builder = "0.44"
# Local git-over-HTTPS auth fixture (tests/git_http_fixture): rustls server with an
# rcgen self-signed cert. ring-backed on both — aws-lc-rs is not in the workspace lock.
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.52.0", features = ["macros", "net", "rt", "rt-multi-thread", "time", "test-util"] }
# The p-gate relay fixture speaks raw NIP-01 over a websocket, because it has to answer a p-gated REQ
# with the `restricted:` prefix — see the module docs for why nostr-relay-builder cannot.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
url = "2.5.8"
uuid = "1.23.5"
