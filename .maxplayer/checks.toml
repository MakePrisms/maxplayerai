# Verification checks for this repository (protocol-v1 §9.1, schema 1).
#
# A reader reads this file only from the pinned base commit. Presence is fail-closed: malformed
# TOML, an unknown field, or an unsafe value is an error, not a skip.
#
# `prepare` MAY use the network. Every command below MUST run WITHOUT it (`net: denied`), so each
# argv here is byte-identical to one proven inside an empty network namespace on this tree — not
# assumed to be hermetic.
#
# WALLET COVERAGE (#720) — why the fourth command below exists, and what it cost to get it.
#
# `maxplayer-core`'s `wallet` feature gates the money path: the buyer's single-call `collect`
# (tests/collect_integrity.rs), the seller node and its durable store, buyer_fund, wallet_ops,
# payment. Until this row, NO declared command turned `wallet` on, so every one of those tests ran
# ZERO times here — a contributor could break collect/settle integrity and all four checks stayed
# green. That blind spot was fallout, never a decision.
#
# What blocked the row was four tests that reach a LIVE third-party mint over the public internet:
# two in `job_lifecycle` (post_job resolves a fee floor at the home's shipped mint.minibits.cash
# default before it publishes) and two in `payment_wallet` (the worker's real send leg fetches
# testnut.cashu.space's keysets through the wallet's own HTTP client). Under `net: denied` all four
# fail DETERMINISTICALLY — measured on this tree, in an empty network namespace with loopback up:
# `--features wallet` was 912 passed / 4 failed, and those four were the only failures.
#
# They now sit behind `maxplayer-core`'s `live-mints` feature — OFF by default, enabled by NO
# command in this file — which is what makes `--features wallet` offline-safe and declarable. They
# are NOT silenced and NOT ignored: the money-path job in .github/workflows/ci.yml turns
# `live-mints` ON, on a runner that has a network, and that job is the only place they run. If that
# `--features …,live-mints` is ever dropped, those four stop running anywhere — check it before
# trusting this note. Gating a test away to make this file pass would be the failure mode, not the
# fix; the split is what made the OTHER 900-odd wallet tests start running under `net: denied`.
#
# Still deliberately NOT declared: the workspace-wide `cargo test --locked`. Each `-p` row names the
# exact feature configuration it proves, which is what makes a red row legible; a workspace row
# would re-unify features across crates and hide which configuration failed. `crate::checks` holds
# that rule — and the wallet row, and the ban on `live-mints` here — as a test.

schema = 1

[env]
kind = "nix-flake"
# flake_path defaults to "." and devshell defaults to "default"; both are correct for this repo, so
# they are omitted rather than restated. flake.nix and flake.lock exist at the root, which §9.1
# requires. The environment reference is the SHA-256 of the flake.lock bytes.

[checks]
# web/app's suite runs its TypeScript through `tsx`, a lockfile-pinned devDependency, so its
# node_modules must exist before any command runs. This is the one step here that legitimately needs
# the network, which is why it is `prepare` and not a command. Measured on this tree: with an empty
# npm cache and the network denied, `npm ci --prefix web/app` fails ENOTFOUND (rc=1) — so it could
# never have been a command. web/network declares zero npm dependencies and needs no counterpart.
prepare = [
    ["cargo", "fetch", "--locked"],
    ["npm", "ci", "--prefix", "web/app"],
]

# `--offline` on the test commands is not redundant with `net: denied`: it makes cargo fail fast and
# legibly instead of attempting a fetch it cannot complete. `cargo build` is declared without it
# because that is the exact argv that was proven.
commands = [
    ["cargo", "build", "--locked"],
    ["cargo", "test", "-p", "maxplayer-core", "--locked", "--offline"],
    ["cargo", "test", "-p", "maxplayer-core", "--features", "acp", "--locked", "--offline"],
    # The money path, per the WALLET COVERAGE note above. `wallet` composes `gateway` and
    # `git-delivery`, so this row is also the only one that runs tests/collect_integrity.rs and the
    # three `required-features` binaries (relay_git_http_auth, git_config_isolation, no_system_git).
    # Its fixtures are loopback-only; it needs `lo`, never a route off the box.
    ["cargo", "test", "-p", "maxplayer-core", "--features", "wallet", "--locked", "--offline"],
    ["cargo", "test", "-p", "maxplayer", "--locked", "--offline"],
    # WEB COVERAGE (#709). Until these two rows, this file declared five cargo rows and no Node row,
    # so every test in web/app and web/network ran ZERO times under the declared set. A delivery
    # could regress the market terminal and attest GREEN. CI catches that break on a pull request to
    # main (the `web-tests` job in .github/workflows/ci.yml); the gate a delivery is PAID against did
    # not. Same shape as the WALLET COVERAGE gap above, and a money defect for the same reason.
    #
    # `npm --prefix <dir> test` rather than a bare `node --test <dir>`: every command here runs from
    # the repo root with no shell, and each package's own `test` script is the thing CI proves. npm
    # runs that script through a shell, which is what expands web/app's `test/*.test.ts` glob and
    # honours its `&&`. Declaring the node argv directly would freeze a glob that no shell expands —
    # measured here, `node --test "web/app/test/*.test.ts"` from the root fails 8/8 (rc=1) because
    # nothing loads tsx, and `node --test web/app/test/` fails 1/1 (rc=1). Both are loud, not
    # silently green, but neither runs the suite. Delegating keeps this file and CI naming ONE
    # definition of each suite, so they cannot drift apart.
    #
    # Both directories, not one. They are separate npm packages with separate runners: web/app is
    # TypeScript through tsx, web/network is plain ESM with no dependencies whose test/package.json
    # sets `main = run-all.mjs` so the directory form reaches all four of its suites. Declaring only
    # one would leave the other exactly as uncovered as before. `crate::checks` holds that as a
    # test, across the spellings that reach a directory.
    #
    # Offline-safe, measured on this tree with the network denied at the socket layer (control: the
    # same TCP probe connects outside the sandbox and gets EPERM inside): web/app 72/72 and
    # web/network 18/18, both rc=0, neither needing even loopback. With node_modules absent the
    # web/app row fails rc=127 `tsc: command not found` — it cannot report green without its deps.
    ["npm", "--prefix", "web/app", "test"],
    ["npm", "--prefix", "web/network", "test"],
]

# A cold run is dominated by compilation, not by the tests: four distinct feature configurations are
# built from a fresh clone. Measured on this tree: the wallet configuration alone compiles in ~5min
# and its tests take ~3.5min (the seller-node reconnect suites are the slow part), against ~45s of
# test time for the other three. The example declaration's 1200s would be a false failure on a cold
# machine; 3600s was already comfortable for three configurations and is not for four, so it is
# raised rather than left to time out on a slow runner. This bounds the run — it weakens no check.
#
# #709 did NOT move this. The two Node rows are measured, not assumed: web/app runs in 1.7s wall and
# web/network in 0.05s, against the ~9min the wallet configuration alone spends compiling and
# testing. They are noise against this bound, and raising a timeout without a measurement behind it
# is how a real timeout stops being a signal.
timeout_secs = 5400
