[workspace]
members = [
    "crates/maxplayer-core",
    "crates/maxplayer-desktop",
    "crates/maxplayer-evals",
    "crates/maxplayer",
    "crates/maxplayer-relay-write-policy",
]
# maxplayer-desktop pulls egui's native deps (wayland/x11/fontconfig); keep it out of
# default builds so headless boxes and CI don't inherit them. Build with -p maxplayer-desktop.
default-members = [
    "crates/maxplayer-core",
    "crates/maxplayer-evals",
    "crates/maxplayer",
    "crates/maxplayer-relay-write-policy",
]
resolver = "3"

[workspace.package]
version = "0.5.0-rc1"
edition = "2024"
description = "Maxplayer"
repository = "https://github.com/MakePrisms/maxplayerai"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
maxplayer-core = { path = "crates/maxplayer-core" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# Layered config resolution (defaults -> file -> MAXPLAYER_* env). default-features off drops the
# bundled format parsers (toml/yaml/json/…): the file layer is parsed by the `toml` crate we
# already carry, and only the serde (`Config::try_from`) and `Environment` sources are used.
config = { version = "0.15.25", default-features = false }
# In-process seller push (libgit2, no system git). default-features off keeps the
# `https`/`ssh` cargo features (and their openssl-sys / libssh2-sys) OUT — TLS is
# supplied by our reqwest/rustls smart subtransport, so the build needs no openssl.
# Swapping this for a `git` CLI would also make repo hooks live. libgit2 runs
# none, so a hook a job planted in its own workdir `.git/` cannot execute — and
# the delivery legs run on the HOST, beside the wallet and keys the sandbox
# exists to protect. A leg that shells out must neutralise hook lookup itself.
# The guard is `crates/maxplayer-core/tests/no_system_git.rs`: it puts a tripwire
# `git` on PATH and fails if a production leg calls it. Its required-features are
# `["git-delivery"]`, so it runs in the money-path CI job and nowhere else (#826).
git2 = { version = "0.19", default-features = false }
# Blocking HTTP for the git smart subtransport; rustls-tls bundles Mozilla CA roots
# (webpki-roots) so the seller needs no ambient SSL_CERT_FILE at runtime.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true

# A release build that can be profiled and, crucially, symbolicated. `release` is stripped and
# thin-LTO'd, so a spindump or `sample` of a stuck seller node yields raw addresses and nothing else —
# diagnosing the #173 park required rebuilding the binary before any capture could be read at all.
# Same optimisation level as release so behaviour and timing are representative:
#
#   cargo build -p maxplayer --profile release-debug --features acp,wallet
[profile.release-debug]
inherits = "release"
debug = true
strip = false
